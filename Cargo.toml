[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
# Doc churn for internal fns we don't expose to other crates.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# `out.push_str(&format!(...))` is fine for incremental string building;
# write!/writeln! is no clearer.
format_push_string = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
